<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN" lang="zh">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="description" content="在云端的一张纸."/>
    <link rel="shortcut icon" type="image/gif" href="asset/images/favicon.gif"/>
    <title>在线记事本 - 在云端的一张纸</title>
    <meta name="description" content="A service by Jacob Bijani."/>
    <link rel="stylesheet" href="asset/stylesheets/master.css?3" type="text/css" media="screen" charset="utf-8"/>
    <link rel="stylesheet" href="asset/stylesheets/print.css?3" type="text/css" media="print" charset="utf-8"/>

    <script src="asset/javascript/prototype.js" type="text/javascript"></script>
    <script type="text/javascript" charset="utf-8">
        var assets_version = 3;
        var is_iphone_os = false;

        var pad_name = `${uri}`;

        var disable_autosave = false;
        var read_only_mode = false;

        var caret_position = 0;
        var scroll_position = 0;
    </script>
    <script type="text/javascript" src="asset/javascript/application.js?3"></script>

    <!-- e:n -->
</head>
<body id="body">

<div id="promo">

</div>

<div class="stack ">
    <div class="layer_1">
        <div class="layer_2">
            <div class="layer_3">
                <textarea name="contents" id="contents" class="contents " spellcheck="true"></textarea>
            </div>
        </div>
    </div>
</div>

<div id="printable_contents" class="contents "></div>

<div id="unsaved" style="display:none;"></div>
<div id="loading" style="display:none;"></div>

<div id="controls">

</div>

<script type='text/javascript'>
    var _sf_async_config = {};
    /** CONFIGURATION START **/
    _sf_async_config.uid = 10600;
    _sf_async_config.domain = 'notepad.cc';
    _sf_async_config.useCanonical = true;
    _sf_async_config.sections = 'Change this to your Section name';  //CHANGE THIS
    _sf_async_config.authors = 'Change this to your Author name';    //CHANGE THIS
    /** CONFIGURATION END **/
    (function () {
        function loadChartbeat() {
            window._sf_endpt = (new Date()).getTime();
            var e = document.createElement('script');
            e.setAttribute('language', 'javascript');
            e.setAttribute('type', 'text/javascript');
            e.setAttribute('src', '//static.chartbeat.com/js/chartbeat.js');
            document.body.appendChild(e);
        }

        var oldonload = window.onload;
        window.onload = (typeof window.onload != 'function') ?
            loadChartbeat : function () {
                oldonload();
                loadChartbeat();
            };
    })();
</script>
</body>
</html>
